name: Build SACarCam

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build ReleaseVC Win32
        run: msbuild SACarCam.sln /p:Configuration=ReleaseVC /p:Platform=x86

      - name: Find output
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "SACarCam.asi" | Select-Object -ExpandProperty FullName
          Write-Host "Found: $files"

      - name: Upload SACarCam.asi
        uses: actions/upload-artifact@v4
        with:
          name: SACarCam
          path: SACarCam/**/ReleaseVC/SACarCam.asi
