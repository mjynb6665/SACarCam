name: Build SACarCam

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build ReleaseVC Win32
        run: msbuild SACarCam.sln /p:Configuration=ReleaseVC /p:Platform=x86

      - name: Find output
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "SACarCam.asi"
          foreach ($f in $files) { Write-Host "Found: $($f.FullName)" }
          if ($files.Count -eq 0) { Write-Host "No ASI found!"; Get-ChildItem -Recurse -Filter "*.asi" | ForEach-Object { Write-Host "Other: $($_.FullName)" } }

      - name: Upload SACarCam.asi
        uses: actions/upload-artifact@v4
        with:
          name: SACarCam
          path: "**/SACarCam.asi"
